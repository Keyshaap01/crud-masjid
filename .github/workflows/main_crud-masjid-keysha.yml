# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# Deploy memakai Publish Profile (tanpa azure/login / OIDC).
# Secret yang dibutuhkan di repo crud-masjid:
#   AZURE_PUBLISH_PROFILE = seluruh isi file publish profile dari Azure Portal
#
# Workflow ini otomatis mencari folder yang berisi index.php,
# jadi tetap jalan walaupun project berada di subfolder repo.

name: Build and deploy PHP app to Azure Web App - crud-masjid-keysha

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Cari folder aplikasi (yang berisi index.php)
        id: app
        run: |
          FILE=$(find . -name index.php -not -path './.git/*' -not -path '*/admin/*' -not -path '*/vendor/*' \
                 | awk '{ print gsub("/", "/"), $0 }' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$FILE" ]; then
            echo "::error::index.php tidak ditemukan di repository"
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Folder aplikasi: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          ls -la "$DIR"

      - name: Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: '${{ steps.app.outputs.dir }}/composer.json'

      - name: Run composer install if composer.json exists
        if: steps.check_files.outputs.files_exists == 'true'
        working-directory: ${{ steps.app.outputs.dir }}
        run: composer validate --no-check-publish && composer install --prefer-dist --no-progress

      - name: Cek sintaks PHP
        working-directory: ${{ steps.app.outputs.dir }}
        run: find . -name "*.php" -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      # File tersembunyi (.env, .git, .github) otomatis tidak ikut di-upload
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: ${{ steps.app.outputs.dir }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: Tampilkan isi yang akan di-deploy
        run: ls -la

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'crud-masjid-keysha'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
